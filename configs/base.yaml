# Settings shared by every experiment. Paths are relative to the repository root.
paths:
  beat2_metadata: data/beat2/clips_w5s/metadata.csv
  beat2_anchors: data/semantix/addons/beat2_anchors.csv
  ted_eval: data/semantix/addons/ted_eval.csv
  ted_motion: data/ted/ted_smplx.npz  # optional, see README
  output_dir: outputs

data:
  split: {seed: 42, train_ratio: 0.9, val_ratio: 0.05, test_ratio: 0.05}

text_encoder:  # frozen g_text
  model_name: Qwen/Qwen3-Embedding-8B
  batch_size: 32
  transcript_prompt_name: query
  anchor_prompt_name: null

model:
  proj_dim: 512
  text_hidden_dim: 512
  dropout: 0.1
  temperature: 0.07
  learnable_temperature: true
  motion_encoder: {hidden_dim: 256, num_layers: 2, num_heads: 4, dropout: 0.1, max_length: 1024}

training:
  seed: 42
  device: auto
  batch_size: 512
  eval_batch_size: 256
  weight_decay: 1.0e-4
  grad_clip: 1.0
